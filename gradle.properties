org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ─── Version de Fern Launcher ────────────────────────────────────────────
# À modifier AVANT chaque nouvelle version (et ajouter une entrée dans CHANGELOG.md).
# fernVersionName : le numéro lisible (0.1.0, 0.2.0…), visible dans le nom de l'APK.
# fernVersionCode : un entier qui doit TOUJOURS augmenter, sinon Android refuse la mise à jour.
fernVersionName=0.26.0
fernVersionCode=39

# ─── Applis sœurs (même dépôt, même clé de signature) ─────────────────────
# Chacune a son propre numéro. Tags des Releases : messages-v0.1.0, contact-v0.1.0.
messagesVersionName=0.4.1
messagesVersionCode=8
contactVersionName=0.3.2
contactVersionCode=8
