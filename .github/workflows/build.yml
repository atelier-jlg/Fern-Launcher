# Compile l'APK de Fern Launcher sur les serveurs de GitHub.
#
# - À chaque push : l'APK est disponible dans l'onglet « Actions » (section Artifacts).
# - Sur un tag « v0.2.0 » : une « Release » est créée avec l'APK à télécharger.
# - Sur un push (hors pull request) avec un numéro de version pas encore publié : la Release
#   (et son tag) sont créés automatiquement, avec l'APK signé.
name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          # Garde les dépendances en cache aussi sur cette branche : moins d'appels à Maven Central.
          cache-read-only: false

      - name: Lire la version
        id: version
        run: |
          name=$(grep '^fernVersionName=' gradle.properties | cut -d= -f2)
          code=$(grep '^fernVersionCode=' gradle.properties | cut -d= -f2)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Fern Launcher v$name (code $code)"

      - name: Vérifier que le tag correspond à la version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.version.outputs.name }}" ]; then
            echo "::error::Le tag ${GITHUB_REF_NAME} ne correspond pas à fernVersionName=${{ steps.version.outputs.name }} (gradle.properties)"
            exit 1
          fi

      - name: Cette version est-elle déjà publiée ?
        id: published
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.version.outputs.name }}" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Préparer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.FERN_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fern.jks"
            echo "FERN_KEYSTORE_PATH=$RUNNER_TEMP/fern.jks" >> "$GITHUB_ENV"
            echo "SIGNATURE=" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::Secret FERN_KEYSTORE_BASE64 absent : impossible de publier une Release non signée."
            exit 1
          else
            echo "::warning::Secret FERN_KEYSTORE_BASE64 absent : APK signé avec une clé de debug jetable (NON-SIGNE). Ne pas l'installer."
            echo "SIGNATURE=-NON-SIGNE" >> "$GITHUB_ENV"
          fi

      - name: Compiler
        env:
          FERN_KEYSTORE_PASSWORD: ${{ secrets.FERN_KEYSTORE_PASSWORD }}
        run: ./gradlew testReleaseUnitTest assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: fern-launcher-v${{ steps.version.outputs.name }}${{ env.SIGNATURE }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publier la Release
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'push' && env.SIGNATURE == '' && steps.published.outputs.exists == 'false')
        uses: softprops/action-gh-release@v2
        with:
          name: Fern Launcher v${{ steps.version.outputs.name }}
          tag_name: v${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
